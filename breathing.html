<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Redirecting…</title>
  <link rel="canonical" href="https://homemade-apps.com/breathing/" />
  <meta http-equiv="refresh" content="0; url=./breathing/" />
  <script>
    // Carry ?lang= through the redirect so old links still land in-language.
    if (location.search) location.replace('./breathing/' + location.search);
  </script>
</head>
<body>
  <p>This page has moved to <a href="./breathing/">/breathing/</a>.</p>
</body>
</html>
